name: Ticket Health Report

on:
  schedule:
    # Every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'

  workflow_dispatch: {}

permissions:
  issues: read
  contents: read

jobs:
  report:
    name: Generate Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Generate markdown report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ticket-health-report.sh

      - name: Generate JSON report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p report-artifacts
          bash scripts/ticket-health-report.sh --json > report-artifacts/ticket-health.json

      - name: Upload JSON artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ticket-health-report
          path: report-artifacts/ticket-health.json
          retention-days: 90
