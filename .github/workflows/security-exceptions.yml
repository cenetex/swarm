name: Security Exception Registry

# Validates the security exception registry and emits reminders
# for exceptions approaching their expiry date.

on:
  # Run on PRs that touch the registry or validation script
  pull_request:
    branches: [main]
    paths:
      - '.github/policy/security-exceptions.json'
      - '.github/policy/security-exceptions.schema.json'
      - 'scripts/validate-security-exceptions.mjs'

  # Run on pushes to main that touch the registry
  push:
    branches: [main]
    paths:
      - '.github/policy/security-exceptions.json'
      - '.github/policy/security-exceptions.schema.json'
      - 'scripts/validate-security-exceptions.mjs'

  # Weekly schedule to catch upcoming expirations
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC

  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '20'

jobs:
  validate:
    name: Validate Exception Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate security exceptions
        run: node scripts/validate-security-exceptions.mjs

  expiry-reminder:
    name: Expiry Reminders
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for expiring exceptions
        id: check
        run: |
          node scripts/validate-security-exceptions.mjs --json > /tmp/exceptions-report.json 2>&1 || true
          EXPIRING=$(node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/exceptions-report.json','utf-8'));
            console.log(r.summary.expiringSoon + r.summary.expiredActive);
          ")
          echo "expiring_count=$EXPIRING" >> "$GITHUB_OUTPUT"

      - name: Create or update reminder issue
        if: steps.check.outputs.expiring_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT=$(cat /tmp/exceptions-report.json)
          TITLE="Security exception(s) expiring or expired"

          BODY=$(node -e "
            const r = JSON.parse(process.env.REPORT);
            const lines = ['## Security Exception Expiry Report', ''];

            if (r.expired.length) {
              lines.push('### Expired (action required)');
              for (const e of r.expired) {
                lines.push('- **' + e.id + '**: ' + e.title + ' (expired ' + e.daysOverdue + ' day(s) ago, owner: @' + e.owner + ')');
              }
              lines.push('');
            }

            if (r.expiringSoon.length) {
              lines.push('### Expiring Soon');
              for (const e of r.expiringSoon) {
                lines.push('- **' + e.id + '**: ' + e.title + ' (' + e.daysRemaining + ' day(s) remaining, owner: @' + e.owner + ')');
              }
              lines.push('');
            }

            lines.push('---');
            lines.push('_Auto-generated by security-exceptions workflow._');
            console.log(lines.join('\n'));
          ")

          # Check if an open issue already exists
          EXISTING=$(gh issue list --label "type:security" --search "$TITLE" --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "type:security,priority:high"
            echo "Created new reminder issue"
          fi
