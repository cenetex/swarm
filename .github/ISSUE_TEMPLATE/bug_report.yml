name: Bug
description: Tell us what is broken
title: ""
labels: ["type:bug"]
assignees: []

body:
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Say what happened and what you expected. Steps, logs, or screenshots help but are optional.
      placeholder: I tried... I expected... Instead...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Useful context
      description: Optional links, environment details, logs, or examples.
    validations:
      required: false
