name: Feature
description: Suggest something useful
title: ""
labels: ["type:feature"]
assignees: []

body:
  - type: textarea
    id: request
    attributes:
      label: What should Swarm do?
      description: Describe the outcome in your own words. You do not need to design the implementation.
      placeholder: I want to be able to...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Useful context
      description: Optional examples, links, sketches, or constraints.
    validations:
      required: false
