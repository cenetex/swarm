# Dependabot configuration for aws-swarm monorepo
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Related: issue #286 — enable baseline repository security controls
# Related: issue #1212 — consolidated to single root entry for pnpm workspace
#
# NOTE: Dependabot alerts and secret scanning are repo-level settings
# that must be enabled via GitHub UI or API, not via this file.
# See the checklist on issue #286 for details.
#
# NOTE: pnpm monorepos resolve all package.json dependencies through the
# workspace root pnpm-lock.yaml. Per-directory npm entries create conflicting
# lockfile PRs that diverge when merged in rapid succession. Consolidated to
# single root entry as recommended by pnpm + Dependabot best practices.

version: 2
updates:
  # ── Root (workspace root with pnpm monorepo) ──────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - "type:security"
      - "priority:medium"

  # ── GitHub Actions ─────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - "type:security"
      - "type:infra"
